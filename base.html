<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #222; }

    /* ── NAV BAR ── */
    nav {
      background: #1e3a5f;
      padding: 14px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    nav .brand { color: #fff; font-size: 20px; font-weight: 700; margin-right: auto; }
    nav a {
      color: #cde; text-decoration: none; font-size: 14px;
      padding: 6px 14px; border-radius: 5px; transition: background .2s;
    }
    nav a:hover { background: #2e5485; }

    /* ── CONTENT WRAPPER ── */
    .container { max-width: 960px; margin: 30px auto; padding: 0 20px; }

    /* ── FLASH MESSAGES ── */
    .flash { padding: 12px 18px; border-radius: 6px; margin-bottom: 18px; font-size: 14px; }
    .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .flash.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* ── CARDS / TABLES ── */
    .card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 28px; margin-bottom: 24px;
    }
    .card h2 { margin-bottom: 18px; color: #1e3a5f; font-size: 20px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #1e3a5f; color: #fff; padding: 10px 14px; text-align: left; }
    td { padding: 10px 14px; border-bottom: 1px solid #e5e7eb; }
    tr:hover td { background: #f7f9ff; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-block; padding: 8px 18px; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; border: none; transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-blue   { background: #1e3a5f; color: #fff; }
    .btn-green  { background: #28a745; color: #fff; }
    .btn-orange { background: #fd7e14; color: #fff; }
    .btn-red    { background: #dc3545; color: #fff; }

    /* ── FORMS ── */
    label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #444; }
    input[type=text], input[type=number] {
      width: 100%; padding: 9px 12px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 14px; margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #1e3a5f; }

    .no-data { color: #888; font-size: 14px; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>

<nav>
  <span class="brand">Employee Management</span>
  <a href="/">Home</a>
  <a href="/add">Add Employee</a>
  <a href="/search">Search</a>
  <a href="/summary">Summary</a>
</nav>

<div class="container">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
