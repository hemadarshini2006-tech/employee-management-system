{% extends "base.html" %}
{% block content %}

<div class="card" style="max-width:500px; margin:0 auto;">
  <h2>Edit Employee #{{ emp.id }}</h2>

  <form method="POST" action="/edit/{{ emp.id }}">
    <label>Full Name</label>
    <input type="text" name="name" value="{{ emp.name }}" required />

    <label>Department</label>
    <input type="text" name="department" value="{{ emp.department }}" required />

    <label>Position / Role</label>
    <input type="text" name="position" value="{{ emp.position }}" required />

    <label>Salary (Rs)</label>
    <input type="number" name="salary" value="{{ emp.salary }}" min="0" step="0.01" required />

    <button type="submit" class="btn btn-blue">Update Employee</button>
    &nbsp;
    <a href="/" class="btn btn-orange">Cancel</a>
  </form>
</div>

{% endblock %}
