{% extends "base.html" %}
{% block content %}

<div class="card" style="max-width:500px; margin:0 auto;">
  <h2>Add New Employee</h2>

  <form method="POST" action="/add">
    <label>Full Name</label>
    <input type="text" name="name" placeholder="e.g. Rahul Kumar" required />

    <label>Department</label>
    <input type="text" name="department" placeholder="e.g. Engineering" required />

    <label>Position / Role</label>
    <input type="text" name="position" placeholder="e.g. Developer" required />

    <label>Salary (Rs)</label>
    <input type="number" name="salary" placeholder="e.g. 50000" min="0" step="0.01" required />

    <button type="submit" class="btn btn-blue">Save Employee</button>
    &nbsp;
    <a href="/" class="btn btn-orange">Cancel</a>
  </form>
</div>

{% endblock %}
